<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nocta — Grupos</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#1B1330;
    --bg-panel:#251B3F;
    --bg-card:#2E2251;
    --coral:#FF6B5B;
    --gold:#E8B84B;
    --mint:#4ADE9E;
    --ink:#F5F0FF;
    --ink-dim:#B7A9D9;
    --hair:#3A2D5C;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% 10%, #2a1f4a 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, #24183f 0%, transparent 45%),
      var(--bg-deep);
    font-family:'Sora', sans-serif;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  h1{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:600;
    font-size:22px;
    margin:0;
  }
  .header{
    padding:18px 16px 14px;
    border-bottom:1px solid var(--hair);
    flex-shrink:0;
  }
  .sub{ color:var(--ink-dim); font-size:12.5px; margin:4px 0 0; }

  /* ---- Lista ---- */
  #vista-lista{ flex:1; overflow-y:auto; padding:14px 16px 90px; }
  .grupo-card{
    background:var(--bg-card);
    border:1px solid var(--hair);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:12px;
  }
  .grupo-card .fila-top{
    display:flex; justify-content:space-between; align-items:baseline; gap:8px;
  }
  .grupo-card h3{
    font-family:'Fraunces', serif; font-weight:600; font-size:16px; margin:0;
  }
  .grupo-card .privado{ color:var(--gold); font-size:11px; font-weight:700; }
  .grupo-card p{ color:var(--ink-dim); font-size:13px; margin:6px 0 10px; line-height:1.4; }
  .grupo-card .meta{
    display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--ink-dim);
  }
  .grupo-card .tiempo{ color:var(--coral); font-weight:700; }
  .btn-unirse{
    margin-top:10px; width:100%; border:none; border-radius:12px;
    background:var(--coral); color:#fff; font-weight:700; font-size:14px;
    padding:10px; cursor:pointer; font-family:'Sora', sans-serif;
  }
  .btn-unirse.ya-dentro{ background:var(--bg-panel); color:var(--mint); border:1px solid var(--mint); }
  .vacio, .cargando, .bloqueado{
    text-align:center; color:var(--ink-dim); font-size:14px; padding:60px 20px;
  }
  .fab-crear{
    position:fixed; right:18px; bottom:24px;
    width:56px; height:56px; border-radius:50%;
    background:var(--gold); color:#251B3F; border:none;
    font-size:26px; font-weight:700; cursor:pointer;
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
  }

  /* ---- Detalle de grupo (chat) ---- */
  #vista-chat{ display:none; flex:1; flex-direction:column; overflow:hidden; }
  .chat-header{
    padding:14px 16px; border-bottom:1px solid var(--hair); flex-shrink:0;
  }
  .chat-header .volver{ background:none; border:none; color:var(--ink-dim); font-size:14px; cursor:pointer; padding:0 0 8px; }
  .chat-header h2{ font-family:'Fraunces', serif; font-size:17px; margin:0 0 4px; }
  .contador{
    display:inline-block; background:var(--bg-card); border:1px solid var(--coral);
    color:var(--coral); font-weight:700; font-size:12px; padding:4px 10px; border-radius:999px;
  }
  #mensajes{ flex:1; overflow-y:auto; padding:14px 16px; }
  .msg{ margin-bottom:12px; max-width:80%; }
  .msg.mio{ margin-left:auto; text-align:right; }
  .msg .autor{ font-size:11px; color:var(--gold); font-weight:700; margin-bottom:3px; }
  .msg .burbuja{
    display:inline-block; background:var(--bg-card); border:1px solid var(--hair);
    border-radius:14px; padding:9px 13px; font-size:14px; line-height:1.35; text-align:left;
  }
  .msg.mio .burbuja{ background:var(--coral); border-color:var(--coral); color:#fff; }
  .barra-msg{
    display:flex; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--hair); flex-shrink:0;
  }
  .barra-msg input{
    flex:1; background:var(--bg-card); border:1px solid var(--hair); border-radius:999px;
    padding:11px 16px; color:var(--ink); font-family:'Sora', sans-serif; font-size:14px;
  }
  .barra-msg input:focus{ outline:none; border-color:var(--coral); }
  .barra-msg button{
    background:var(--coral); border:none; border-radius:999px; color:#fff;
    font-weight:700; padding:0 18px; cursor:pointer;
  }

  /* ---- Modal crear grupo ---- */
  #modal-crear{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55);
    align-items:flex-end; z-index:10;
  }
  #modal-crear .hoja{
    background:var(--bg-panel); width:100%; border-radius:20px 20px 0 0;
    padding:20px 16px calc(20px + env(safe-area-inset-bottom));
  }
  #modal-crear h2{ font-family:'Fraunces', serif; font-size:19px; margin:0 0 14px; }
  .campo{ margin-bottom:14px; }
  .campo label{ display:block; font-size:11px; color:var(--gold); font-weight:700; text-transform:uppercase; margin-bottom:6px; }
  .campo input, .campo textarea{
    width:100%; background:var(--bg-card); border:1px solid var(--hair); border-radius:12px;
    padding:10px 12px; color:var(--ink); font-family:'Sora', sans-serif; font-size:14px; resize:none;
  }
  .campo input:focus, .campo textarea:focus{ outline:none; border-color:var(--coral); }
  .fila-2{ display:flex; gap:10px; }
  .fila-2 .campo{ flex:1; }
  .btn-fila{ display:flex; gap:10px; margin-top:6px; }
  .btn-fila button{
    flex:1; border:none; border-radius:12px; padding:12px; font-weight:700;
    font-family:'Sora', sans-serif; font-size:14px; cursor:pointer;
  }
  .btn-cancelar{ background:var(--bg-card); color:var(--ink-dim); }
  .btn-crear{ background:var(--coral); color:#fff; }
</style>
</head>
<body>

  <div class="header">
    <h1>Grupos</h1>
    <p class="sub">Espacios temporales, se cierran solos</p>
  </div>

  <div id="vista-lista">
    <div id="lista-contenido" class="cargando">Cargando grupos…</div>
  </div>

  <button class="fab-crear" id="btn-fab" style="display:none">+</button>

  <div id="vista-chat">
    <div class="chat-header">
      <button class="volver" id="btn-volver">← Grupos</button>
      <h2 id="chat-nombre"></h2>
      <span class="contador" id="chat-contador"></span>
    </div>
    <div id="mensajes"></div>
    <div class="barra-msg">
      <input type="text" id="input-msg" maxlength="500" placeholder="Escribe algo…">
      <button id="btn-enviar">Enviar</button>
    </div>
  </div>

  <div id="modal-crear">
    <div class="hoja">
      <h2>Crear grupo</h2>
      <div class="campo">
        <label>Nombre</label>
        <input type="text" id="nuevo-nombre" maxlength="60" placeholder="Ej. Rooftop viernes CDMX">
      </div>
      <div class="campo">
        <label>Descripción corta</label>
        <textarea id="nuevo-descripcion" rows="2" maxlength="140" placeholder="De qué va este grupo…"></textarea>
      </div>
      <div class="fila-2">
        <div class="campo">
          <label>Capacidad (50-100)</label>
          <input type="number" id="nuevo-capacidad" min="50" max="100" value="50">
        </div>
        <div class="campo">
          <label>Duración (horas, máx 72)</label>
          <input type="number" id="nuevo-duracion" min="1" max="72" value="24">
        </div>
      </div>
      <div class="btn-fila">
        <button class="btn-cancelar" id="btn-cancelar-crear">Cancelar</button>
        <button class="btn-crear" id="btn-confirmar-crear">Crear grupo</button>
      </div>
    </div>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();
  const initData = tg?.initData || '';
  const API_BASE = 'https://nocta-bot-production.up.railway.app';

  const cabecera = { 'x-telegram-init-data': initData };
  let grupoActivoId = null;
  let pollInterval = null;

  function tiempoRestante(fechaExpiracion) {
    const ms = new Date(fechaExpiracion) - new Date();
    if (ms <= 0) return 'Expirado';
    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  }

  async function cargarGrupos() {
    const cont = document.getElementById('lista-contenido');
    try {
      const res = await fetch(`${API_BASE}/api/grupos`, { headers: cabecera });
      const data = await res.json();

      if (data.bloqueado) {
        cont.className = 'bloqueado';
        cont.innerHTML = '🔒 Entrar a grupos es exclusivo de Plus y Premium.';
        return;
      }

      document.getElementById('btn-fab').style.display = data.puedeCrear ? 'block' : 'none';

      if (!data.grupos || data.grupos.length === 0) {
        cont.className = 'vacio';
        cont.innerHTML = 'No hay grupos activos ahora mismo. ¡Vuelve más tarde!';
        return;
      }

      cont.className = '';
      cont.innerHTML = data.grupos.map((g) => `
        <div class="grupo-card">
          <div class="fila-top">
            <h3>${escapeHtml(g.nombre)}</h3>
            ${g.es_privado ? '<span class="privado">💎 PRIVADO</span>' : ''}
          </div>
          <p>${escapeHtml(g.descripcion || 'Sin descripción')}</p>
          <div class="meta">
            <span>${g.miembros_actuales}/${g.capacidad_maxima} miembros</span>
            <span class="tiempo">⏳ ${tiempoRestante(g.fecha_expiracion)}</span>
          </div>
          <button class="btn-unirse ${g.ya_soy_miembro ? 'ya-dentro' : ''}" data-id="${g.id}">
            ${g.ya_soy_miembro ? '✅ Entrar al chat' : 'Unirme'}
          </button>
        </div>
      `).join('');

      cont.querySelectorAll('.btn-unirse').forEach((btn) => {
        btn.addEventListener('click', () => manejarUnirse(btn));
      });
    } catch (e) {
      cont.className = 'vacio';
      cont.innerHTML = 'No se pudo cargar. Cierra y vuelve a abrir la app.';
    }
  }

  async function manejarUnirse(btn) {
    const grupoId = btn.dataset.id;
    if (btn.classList.contains('ya-dentro')) {
      abrirChat(grupoId);
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Uniéndote…';
    try {
      const res = await fetch(`${API_BASE}/api/grupos/${grupoId}/unirse`, { method: 'POST', headers: cabecera });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Error');
      tg?.HapticFeedback?.notificationOccurred('success');
      abrirChat(grupoId);
    } catch (e) {
      alert(e.message);
      btn.disabled = false;
      btn.textContent = 'Unirme';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---- Chat ----
  async function abrirChat(grupoId) {
    grupoActivoId = grupoId;
    document.getElementById('vista-lista').style.display = 'none';
    document.getElementById('btn-fab').style.display = 'none';
    document.getElementById('vista-chat').style.display = 'flex';
    await cargarMensajes();
    pollInterval = setInterval(cargarMensajes, 4000);
  }

  function cerrarChat() {
    grupoActivoId = null;
    clearInterval(pollInterval);
    document.getElementById('vista-chat').style.display = 'none';
    document.getElementById('vista-lista').style.display = 'block';
    cargarGrupos();
  }

  async function cargarMensajes() {
    if (!grupoActivoId) return;
    try {
      const res = await fetch(`${API_BASE}/api/grupos/${grupoActivoId}/mensajes`, { headers: cabecera });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);

      document.getElementById('chat-nombre').textContent = data.grupo.nombre;
      document.getElementById('chat-contador').textContent = '⏳ ' + tiempoRestante(data.grupo.fecha_expiracion);

      const cont = document.getElementById('mensajes');
      const yoTelegram = JSON.parse(decodeURIComponent(initData.split('user=')[1]?.split('&')[0] || '{}')).id;
      cont.innerHTML = data.mensajes.map((m) => `
        <div class="msg ${m.telegram_id === yoTelegram ? 'mio' : ''}">
          <div class="autor">${m.telegram_id === yoTelegram ? '' : escapeHtml(m.nombre)}</div>
          <div class="burbuja">${escapeHtml(m.texto)}</div>
        </div>
      `).join('');
      cont.scrollTop = cont.scrollHeight;
    } catch (e) {
      cerrarChat();
    }
  }

  document.getElementById('btn-volver').addEventListener('click', cerrarChat);

  document.getElementById('btn-enviar').addEventListener('click', enviarMensaje);
  document.getElementById('input-msg').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') enviarMensaje();
  });

  async function enviarMensaje() {
    const input = document.getElementById('input-msg');
    const texto = input.value.trim();
    if (!texto || !grupoActivoId) return;
    input.value = '';
    try {
      await fetch(`${API_BASE}/api/grupos/${grupoActivoId}/mensajes`, {
        method: 'POST',
        headers: { ...cabecera, 'Content-Type': 'application/json' },
        body: JSON.stringify({ texto }),
      });
      cargarMensajes();
    } catch (e) {}
  }

  // ---- Crear grupo ----
  document.getElementById('btn-fab').addEventListener('click', () => {
    document.getElementById('modal-crear').style.display = 'flex';
  });
  document.getElementById('btn-cancelar-crear').addEventListener('click', () => {
    document.getElementById('modal-crear').style.display = 'none';
  });
  document.getElementById('btn-confirmar-crear').addEventListener('click', async () => {
    const nombre = document.getElementById('nuevo-nombre').value.trim();
    const descripcion = document.getElementById('nuevo-descripcion').value.trim();
    const capacidad_maxima = document.getElementById('nuevo-capacidad').value;
    const duracion_horas = document.getElementById('nuevo-duracion').value;

    if (!nombre) { alert('Ponle un nombre al grupo.'); return; }

    try {
      const res = await fetch(`${API_BASE}/api/grupos`, {
        method: 'POST',
        headers: { ...cabecera, 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, descripcion, capacidad_maxima, duracion_horas }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      document.getElementById('modal-crear').style.display = 'none';
      tg?.HapticFeedback?.notificationOccurred('success');
      cargarGrupos();
    } catch (e) {
      alert(e.message);
    }
  });

  cargarGrupos();
</script>
</body>
</html>
